<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600" stop-opacity="0"/>
      <stop offset=".35" stop-color="#e10600" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>

  <g transform="rotate(-14 600 315)">
    <rect x="-200" y="120" width="1600" height="2" fill="url(#lane)"/>
    <rect x="-200" y="250" width="1600" height="2" fill="url(#lane)"/>
    <rect x="-200" y="380" width="1600" height="2" fill="url(#hot)"/>
    <rect x="-200" y="510" width="1600" height="2" fill="url(#lane)"/>
  </g>

  <g transform="translate(84 190)">
    <rect y="0"  width="52" height="6" rx="3" fill="#f4f4f2" opacity=".35"/>
    <rect y="15" width="52" height="6" rx="3" fill="#f4f4f2" opacity=".7"/>
    <rect y="30" width="52" height="6" rx="3" fill="#e10600"/>
  </g>
  <text x="152" y="224" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-.5" fill="#f4f4f2">Running<tspan fill="#a5a5a0" font-weight="400">Result</tspan></text>

  <text x="84" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#f4f4f2">The world&#8217;s most advanced</text>
  <text x="84" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-style="italic" fill="#e10600">running database.</text>

  <rect x="84" y="496" width="44" height="3" fill="#e10600"/>
  <text x="84" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#a5a5a0">Every race. Every split. Every athlete.</text>
</svg>
